name: Data refresh

# Daily:   stream gauges, news feed, county documents, permits and company records  (run_all.py --frequent)
# Monthly: the daily ones plus every layer that refreshes itself                      (run_all.py --all)
#          Yearly sources are checked here too: population and housing rebuilds only when a new
#          survey release is out, and school enrollment picks up a new school year when it is published.
# By hand, on your own computer: project holdings, land values, parcel lines, drive times and the
#          reinvestment zone. Their parcel downloads are refused from GitHub's servers, or they are one-time layers.
# Manual:  Actions tab > Data refresh > Run workflow, and pick which of the two to run

on:
  schedule:
    - cron: "43 12 * * *"     # daily, 12:43 UTC (7:43 a.m. in Texas in summer, 6:43 a.m. in winter)
    - cron: "43 13 1 * *"     # 1st of each month, 13:43 UTC, an hour after that day's daily run
  workflow_dispatch:
    inputs:
      mode:
        description: What to refresh
        type: choice
        options: [frequent, all]
        default: frequent

permissions:
  contents: write             # to push the refreshed data

concurrency:
  group: data-refresh         # never two refreshes at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Chicago     # so "today" in the data matches Grimes County
    steps:
      - uses: actions/checkout@v7

      - name: Check out the document archive
        uses: actions/checkout@v7
        with:
          ref: archive            # kept copies of county documents live on their own branch, away from the site
          path: data/archive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y --no-install-recommends tesseract-ocr   # reads scanned county minutes

      - name: Refresh data
        id: refresh
        continue-on-error: true   # keep the layers that worked; the job is failed at the end instead
        env:
          MODE: ${{ github.event.schedule == '43 13 1 * *' && 'all' || github.event.inputs.mode || 'frequent' }}
        run: python scripts/run_all.py --$MODE

      - name: Commit and push new archive copies
        run: |
          # Before the data itself, so the list of what has been seen never points at a copy that was not kept
          cd data/archive
          git add -A
          if git diff --cached --quiet; then
            echo "No new documents to keep."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Documents kept $(date +%F)"
          git pull --rebase origin archive
          git push origin HEAD:archive

      - name: Commit and push changed data
        run: |
          # meta.json records the run date, so it changes on every run. On its own that is not a change worth a commit.
          if git diff --quiet -- data ':(exclude)data/meta.json' && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data refresh $(date +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Report failed layers
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "One or more layers failed. See the Refresh data step above for which ones."
          exit 1
